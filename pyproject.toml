[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tanpopo"
version = "0.2.0"
description = "Conditional spatial covariance programs for spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Matthew Ceko", email = "matthew.ceko@petermac.org" }]
dependencies = [
  "typer>=0.12",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "anndata>=0.10",
  "scanpy>=1.10",
  "h5py>=3.8"
]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24"]

[project.scripts]
tanpopo = "tanpopo.workflows:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 99
