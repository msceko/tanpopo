[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tanpopo"
version = "0.3.0"
description = "Geometry-standardised spatial covariance programs for spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Matthew Ceko", email = "matthew.ceko@petermac.org" }]
dependencies = [
  "typer>=0.12",
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "anndata>=0.10"
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
cluster = ["scanpy>=1.10", "igraph>=0.11", "leidenalg>=0.10"]
gsea = ["gseapy>=1.1"]
dev = ["pytest>=8", "black>=24", "matplotlib>=3.8"]

[project.scripts]
tanpopo = "tanpopo.workflows:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tanpopo*"]
exclude = ["tests*", "build*"]
namespaces = false

[tool.black]
line-length = 99
